name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: UWF smoke suite
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install model-adaptation dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install model-adaptation dependencies
          executable: npm
          arguments-json: '["ci","--no-audit","--no-fund"]'
          working-directory: .github/skills/uwf-model-adaptation
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Install orchestration-engine dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install orchestration-engine dependencies
          executable: npm
          arguments-json: '["ci","--no-audit","--no-fund"]'
          working-directory: .github/skills/uwf-orchestration-engine
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Install state-manager dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install state-manager dependencies
          executable: npm
          arguments-json: '["ci","--no-audit","--no-fund"]'
          working-directory: .github/skills/uwf-state-manager
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Install ADR dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install ADR dependencies
          executable: npm
          arguments-json: '["ci","--no-audit","--no-fund"]'
          working-directory: .github/skills/uwf-adr
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Install discovery dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install discovery dependencies
          executable: npm
          arguments-json: '["ci","--no-audit","--no-fund"]'
          working-directory: .github/skills/uwf-discovery
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Install local-tracking dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install local-tracking dependencies
          executable: npm
          arguments-json: '["ci","--no-audit","--no-fund"]'
          working-directory: .github/skills/uwf-local-tracking
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Install question-protocol dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install question-protocol dependencies
          executable: npm
          arguments-json: '["ci","--no-audit","--no-fund"]'
          working-directory: .github/skills/uwf-question-protocol
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Install review dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install review dependencies
          executable: npm
          arguments-json: '["ci","--no-audit","--no-fund"]'
          working-directory: .github/skills/uwf-review
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Install requirements dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install requirements dependencies
          executable: npm
          arguments-json: '["ci","--no-audit","--no-fund"]'
          working-directory: .github/skills/uwf-requirements
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Run complete UWF smoke suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/uwf-smoke/*.mjs; do
            node "$test_file"
          done

  companion:
    name: UWF Companion
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: uwf-companion
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: uwf-companion/package-lock.json

      - name: Install locked Companion dependencies
        uses: qwts/playbook-engineering/.github/actions/bounded-command@5455a3f5939369ea843b1bbb4d2573739f4381a6
        with:
          task: Install locked Companion dependencies
          executable: npm
          arguments-json: '["ci","--no-audit","--no-fund"]'
          working-directory: uwf-companion
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Build and test Companion
        run: npm test

  workflow-runtime:
    name: Workflow runtime policy
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned runtime checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qwts/playbook-engineering
          ref: 5455a3f5939369ea843b1bbb4d2573739f4381a6
          path: .ci-runtime-policy
          sparse-checkout: tools/ci-runtime
          persist-credentials: false
      - name: Enforce bounded workflow runtime
        run: node .ci-runtime-policy/tools/ci-runtime/runtime-policy.mjs --root "$GITHUB_WORKSPACE"
